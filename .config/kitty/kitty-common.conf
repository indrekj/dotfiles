# Shared between kitty-osx.conf and kitty-linux.conf. Each OS file includes this
# via ${HOME}/dotfiles/... because kitty resolves relative include paths against
# the directory of the ~/.config/kitty/kitty.conf symlink, not the real file.

# Tab bar
tab_bar_edge top
tab_bar_style separator
tab_separator " ┇ "
tab_title_max_length 20

scrollback_lines 40000

# A little breathing room around the text
window_padding_width 8

# Don't show "audio bell" / no annoying flashes
enable_audio_bell no

# Desktop notification when a command that ran over 10s finishes in a tab that
# is not visible. Needs shell integration, which is on by default.
notify_on_cmd_finish invisible 10.0
